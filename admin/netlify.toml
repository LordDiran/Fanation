# Netlify equivalent of vercel.json. Only the file matching your host is read —
# shipping both means the project deploys on either without an edit.

[build]
  command = "npm run build"
  publish = "dist"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF ."

# Every URL serves index.html and React Router decides what to render. Without
# this rule a hard refresh on /payouts returns a 404: the file does not exist,
# and in a single-page app it never will.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The console is internal. The noindex meta tag in index.html covers crawlers
# that read HTML; this header covers the ones that only read headers, and it is
# the one that applies to the JSON and asset responses too.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
