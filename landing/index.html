<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Icons. Vite injects nothing, so every one of these is declared by hand;
         the files themselves come from `tools/brand-assets/generate-icons.mjs`.
         `favicon.ico` needs no tag — browsers ask for it at the root regardless —
         but it is declared anyway so a reader of this file knows it exists. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>Fanation — Turn Followers Into Fans. Turn Fans Into Income.</title>
    <meta
      name="description"
      content="Fanation is the creator monetization and community platform where creators build direct relationships with their audience, generate recurring income, and own their communities."
    />

    <!-- og:image must be absolute — every unfurler resolves it against nothing,
         so a relative path renders a blank card. Change this host when the site
         moves off fanation.app. -->
    <meta property="og:url" content="https://fanation.app/" />
    <meta property="og:site_name" content="Fanation" />
    <meta property="og:title" content="Fanation — Turn Followers Into Fans. Turn Fans Into Income." />
    <meta
      property="og:description"
      content="Build a loyal fan community, earn recurring income, and own your relationship with your audience — all from one platform."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://fanation.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Fanation — creator monetization platform" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#07091A" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
